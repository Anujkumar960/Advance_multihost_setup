Organizations:

    - &OrdererOrg
        Name: OrdererOrg
        ID: OrdererMSP
        MSPDir: ../../setup1/vm1_orderer/crypto-config/ordererOrganizations/example.com/msp

        Policies:
            Readers:
                Type: Signature
                Rule: "OR('OrdererMSP.member')"
            Writers:
                Type: Signature
                Rule: "OR('OrdererMSP.member')"
            Admins:
                Type: Signature
                Rule: "OR('OrdererMSP.admin')"

    - &OrdererOrg2
        Name: OrdererOrg2
        ID: OrdererMSP2
        MSPDir: ../../setup1/vm2_orderer/crypto-config/ordererOrganizations/example.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('OrdererMSP2.member')"
            Writers:
                Type: Signature
                Rule: "OR('OrdererMSP2.member')"
            Admins:
                Type: Signature
                Rule: "OR('OrdererMSP2.admin')"

    # - &OrdererOrg3
    #     Name: OrdererOrg3
    #     ID: OrdererMSP3
    #     MSPDir: ../../setup1/vm3_orderer/crypto-config/ordererOrganizations/example.com/msp
    #     Policies:
    #         Readers:
    #             Type: Signature
    #             Rule: "OR('OrdererMSP3.member')"
    #         Writers:
    #             Type: Signature
    #             Rule: "OR('OrdererMSP3.member')"
    #         Admins:
    #             Type: Signature
    #             Rule: "OR('OrdererMSP3.admin')"

    - &Org1
        Name: Org1MSP
        ID: Org1MSP

        MSPDir: ../../setup1/vm1_org1/crypto-config/peerOrganizations/org1.example.com/msp

        Policies:
            Readers:
                Type: Signature
                Rule: "OR('Org1MSP.admin', 'Org1MSP.peer', 'Org1MSP.client')"
            Writers:
                Type: Signature
                Rule: "OR('Org1MSP.admin', 'Org1MSP.client')"
            Admins:
                Type: Signature
                Rule: "OR('Org1MSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('Org1MSP.peer')"

        AnchorPeers:
            - Host: peer0.org1.example.com
              Port: 7051

    - &Org2
        Name: Org2MSP

        ID: Org2MSP

        MSPDir: ../../setup1/vm1_org2/crypto-config/peerOrganizations/org2.example.com/msp

        Policies:
            Readers:
                Type: Signature
                Rule: "OR('Org2MSP.admin', 'Org2MSP.peer', 'Org2MSP.client')"
            Writers:
                Type: Signature
                Rule: "OR('Org2MSP.admin', 'Org2MSP.client')"
            Admins:
                Type: Signature
                Rule: "OR('Org2MSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('Org2MSP.peer')"

        AnchorPeers:
            - Host: peer0.org2.example.com
              Port: 9051

    - &Org3
        Name: Org3MSP

        ID: Org3MSP

        MSPDir: ../../setup1/vm2_org3/crypto-config/peerOrganizations/org3.example.com/msp

        Policies:
            Readers:
                Type: Signature
                Rule: "OR('Org3MSP.admin', 'Org3MSP.peer', 'Org3MSP.client')"
            Writers:
                Type: Signature
                Rule: "OR('Org3MSP.admin', 'Org3MSP.client')"
            Admins:
                Type: Signature
                Rule: "OR('Org3MSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('Org3MSP.peer')"

        AnchorPeers:
            - Host: peer0.org3.example.com
              Port: 11051

Capabilities:
    Channel: &ChannelCapabilities
        V2_0: true

    Orderer: &OrdererCapabilities
        V2_0: true

    Application: &ApplicationCapabilities
        V2_0: true

Application: &ApplicationDefaults

    Organizations:

    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
        LifecycleEndorsement:
            Type: ImplicitMeta
            Rule: "MAJORITY Endorsement"
        Endorsement:
            Type: ImplicitMeta
            Rule: "MAJORITY Endorsement"

    Capabilities:
        <<: *ApplicationCapabilities

Orderer: &OrdererDefaults

    OrdererType: etcdraft

    EtcdRaft:
        Consenters:
        - Host: orderer.example.com
          Port: 7050
          ClientTLSCert: ../../setup1/vm1_orderer/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
          ServerTLSCert: ../../setup1/vm1_orderer/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
    Addresses:
        - orderer.example.com:7050

    BatchTimeout: 2s
    BatchSize:
        MaxMessageCount: 10
        AbsoluteMaxBytes: 99 MB
        PreferredMaxBytes: 512 KB

    Organizations:
    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
        BlockValidation:
            Type: ImplicitMeta
            Rule: "ANY Writers"

Channel: &ChannelDefaults
    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"

    Capabilities:
        <<: *ChannelCapabilities

Profiles:

    BasicChannel:
        Consortium: SampleConsortium
        <<: *ChannelDefaults
        Application:
            <<: *ApplicationDefaults
            Organizations:
                - *Org1
                - *Org2
                - *Org3
            Capabilities:
                <<: *ApplicationCapabilities

    OrdererGenesis:
        <<: *ChannelDefaults
        Capabilities:
            <<: *ChannelCapabilities
        Orderer:
            <<: *OrdererDefaults
            OrdererType: etcdraft
            EtcdRaft:
                Consenters:
                - Host: orderer.example.com
                  Port: 7050
                  ClientTLSCert: ../../setup1/vm1_orderer/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
                  ServerTLSCert: ../../setup1/vm1_orderer/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
                - Host: orderer2.example.com
                  Port: 8050
                  ClientTLSCert: ../../setup1/vm1_orderer/crypto-config/ordererOrganizations/example.com/orderers/orderer2.example.com/tls/server.crt
                  ServerTLSCert: ../../setup1/vm1_orderer/crypto-config/ordererOrganizations/example.com/orderers/orderer2.example.com/tls/server.crt
                - Host: orderer3.example.com
                  Port: 9050
                  ClientTLSCert: ../../setup1/vm1_orderer/crypto-config/ordererOrganizations/example.com/orderers/orderer3.example.com/tls/server.crt
                  ServerTLSCert: ../../setup1/vm1_orderer/crypto-config/ordererOrganizations/example.com/orderers/orderer3.example.com/tls/server.crt
                - Host: orderer4.example.com
                  Port: 10050
                  ClientTLSCert: ../../setup1/vm2_orderer/crypto-config/ordererOrganizations/example.com/orderers/orderer4.example.com/tls/server.crt
                  ServerTLSCert: ../../setup1/vm2_orderer/crypto-config/ordererOrganizations/example.com/orderers/orderer4.example.com/tls/server.crt
                - Host: orderer5.example.com
                  Port: 11050
                  ClientTLSCert: ../../setup1/vm2_orderer/crypto-config/ordererOrganizations/example.com/orderers/orderer5.example.com/tls/server.crt
                  ServerTLSCert: ../../setup1/vm2_orderer/crypto-config/ordererOrganizations/example.com/orderers/orderer5.example.com/tls/server.crt
                - Host: orderer6.example.com
                  Port: 12050
                  ClientTLSCert: ../../setup1/vm2_orderer/crypto-config/ordererOrganizations/example.com/orderers/orderer6.example.com/tls/server.crt
                  ServerTLSCert: ../../setup1/vm2_orderer/crypto-config/ordererOrganizations/example.com/orderers/orderer6.example.com/tls/server.crt
                # - Host: orderer7.example.com
                #   Port: 13050
                #   ClientTLSCert: ../../setup1/vm3_orderer/crypto-config/ordererOrganizations/example.com/orderers/orderer7.example.com/tls/server.crt
                #   ServerTLSCert: ../../setup1/vm3_orderer/crypto-config/ordererOrganizations/example.com/orderers/orderer7.example.com/tls/server.crt
                # - Host: orderer8.example.com
                #   Port: 14050
                #   ClientTLSCert: ../../setup1/vm3_orderer/crypto-config/ordererOrganizations/example.com/orderers/orderer8.example.com/tls/server.crt
                #   ServerTLSCert: ../../setup1/vm3_orderer/crypto-config/ordererOrganizations/example.com/orderers/orderer8.example.com/tls/server.crt
                # - Host: orderer9.example.com
                #   Port: 15050
                #   ClientTLSCert: ../../setup1/vm3_orderer/crypto-config/ordererOrganizations/example.com/orderers/orderer9.example.com/tls/server.crt
                #   ServerTLSCert: ../../setup1/vm3_orderer/crypto-config/ordererOrganizations/example.com/orderers/orderer9.example.com/tls/server.crt
            Addresses:
                - orderer.example.com:7050
                - orderer2.example.com:8050
                - orderer3.example.com:9050
                - orderer4.example.com:10050
                - orderer5.example.com:11050
                - orderer6.example.com:12050
                # - orderer7.example.com:13050
                # - orderer8.example.com:14050
                # - orderer9.example.com:15050

            Organizations:
            - *OrdererOrg
            - *OrdererOrg2
            # - *OrdererOrg3
            Capabilities:
                <<: *OrdererCapabilities
        Consortiums:
            SampleConsortium:
                Organizations:
                - *Org1
                - *Org2
                - *Org3
