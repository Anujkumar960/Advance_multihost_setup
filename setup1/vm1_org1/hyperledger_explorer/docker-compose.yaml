# version: "2.1"

volumes:
  pgdata:
  walletstore:

networks:
  hirestar-network:
      external: true

services:
  explorerdb.hirestar.com:
    image: hyperledger/explorer-db:latest
    container_name: explorerdb.hirestar.com
    hostname: explorerdb.hirestar.com
    environment:
      - DATABASE_DATABASE=fabricexplorer
      - DATABASE_USERNAME=hppoc
      - DATABASE_PASSWORD=password
    healthcheck:
      test: "pg_isready -h localhost -p 5432 -q -U postgres"
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - hirestar-network

  explorer.hirestar.com:
    image: hyperledger/explorer:latest
    container_name: explorer.hirestar.com
    hostname: explorer.hirestar.com
    environment:
      - DATABASE_HOST=explorerdb.hirestar.com
      - DATABASE_DATABASE=fabricexplorer
      - DATABASE_USERNAME=hppoc
      - DATABASE_PASSWD=password
      - LOG_LEVEL_APP=debug
      - LOG_LEVEL_DB=debug
      - LOG_LEVEL_CONSOLE=info
      - LOG_CONSOLE_STDOUT=true
      - DISCOVERY_AS_LOCALHOST=false
    volumes:
      - ./config.json:/opt/explorer/app/platform/fabric/config.json
      - ./first-network.json:/opt/explorer/app/platform/fabric/first-network.json
      - ../crypto-config/peerOrganizations:/tmp/crypto
      - walletstore:/opt/explorer/wallet
    ports:
      - 8080:8080
    depends_on:
      explorerdb.hirestar.com:
        condition: service_healthy
    networks:
      - hirestar-network